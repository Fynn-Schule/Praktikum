name: Multitool
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  torch_light: ^1.0.1
  sensors_plus: ^6.1.1
  camera: ^0.11.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Das Tool zum Generieren der Icons
  flutter_launcher_icons: ^0.13.1

# Konfiguration für das App-Icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # Optional: Verhindert weiße Ränder bei Android durch eine Hintergrundfarbe
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  # Hier wird das Bild als Asset registriert
